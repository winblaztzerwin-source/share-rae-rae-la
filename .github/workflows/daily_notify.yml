name: Daily Share Notification

on:
  schedule:
    - cron: '0 1 * * *'  # 01:00 UTC = 08:00 เวลาไทย
  workflow_dispatch:      # เพิ่มปุ่มให้กดรันเองเพื่อทดสอบได้

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4  # 👈 อัปเดตจาก v3 เป็น v4

      - name: Setup Python
        uses: actions/setup-python@v5  # 👈 อัปเดตจาก v4 เป็น v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install gspread google-auth requests python-dateutil

      - name: Run Bot Script
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          SHEET_URL: ${{ secrets.SHEET_URL }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python bot.py
