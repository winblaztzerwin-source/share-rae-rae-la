name: Daily Share Notification

on:
  schedule:
    - cron: '45 23 * * *'  # 23:45 UTC = 06:45 เวลาไทย
  workflow_dispatch:      # เพิ่มปุ่มให้กดรันเองเพื่อทดสอบได้

# 👇 เพิ่ม 2 บรรทัดนี้ลงไปเพื่อบังคับใช้ Node 24 ล่วงหน้าเลย แจ้งเตือนจะได้หายไปครับ
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install gspread google-auth requests python-dateutil

      - name: Run Bot Script
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          SHEET_URL: ${{ secrets.SHEET_URL }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python bot.py
